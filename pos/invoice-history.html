<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Invoice History - ZYZAAL POS</title>

    <!-- Invoice History CSS -->
    <link
        rel="stylesheet"
        href="css/invoice-history.css">

</head>

<body>

    <h1>ZYZAAL POS</h1>

    <h2>Invoice History</h2>

    <p>Search and view all invoices</p>

    <div>

        <input
            type="text"
            id="searchInvoice"
            placeholder="Search by Invoice No / Customer / Mobile / Item">

        <button onclick="loadBills()">
            Refresh
        </button>

    </div>

    <br>

    <div id="invoiceList">

        Loading invoices...

    </div>


    <!-- Invoice History JS -->
    <script
        src="js/invoice-history.js">
    </script>

</body>

</html>
