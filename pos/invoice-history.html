<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Invoice History - ZYZAAL POS</title>

    <link
        rel="stylesheet"
        href="css/invoice-history.css">

</head>


<body>


<div class="page">


    <!-- ================= HEADER ================= -->

    <div class="page-header">

        <div class="header-icon">
            🧾
        </div>

        <div>

            <h1>
                Invoice History
            </h1>

            <p>
                Search and view all invoices
            </p>

        </div>

    </div>


    <!-- ================= FILTER BAR ================= -->

    <div class="filter-bar">


        <!-- SEARCH -->

        <div class="search-box">

            <span>⌕</span>

            <input
                type="text"
                id="searchInvoice"
                placeholder="Search by Invoice No / Customer / Mobile / Item">

        </div>


        <!-- DATE -->

        <div class="date-box">

            <input
                type="date"
                id="invoiceDate">

        </div>


        <!-- PAYMENT -->

        <div class="payment-box">

            <select id="paymentFilter">

                <option value="">
                    All Payment Methods
                </option>

                <option value="Cash">
                    Cash
                </option>

                <option value="Card">
                    Card
                </option>

                <option value="UPI">
                    UPI
                </option>

                <option value="Wallet">
                    Wallet
                </option>

            </select>

        </div>


        <!-- FILTER -->

        <button
            class="filter-btn"
            onclick="applyFilters()">

            ⚱ Filters

        </button>


        <!-- REFRESH -->

        <button
            class="refresh-btn"
            onclick="loadBills()">

            ⟳ Refresh

        </button>


    </div>



    <!-- ================= SUMMARY ================= -->

    <div class="summary">


        <div class="summary-card">

            <div class="summary-title">
                Total Invoices
            </div>

            <div
                class="summary-value"
                id="totalInvoices">

                0

            </div>

        </div>


        <div class="summary-card">

            <div class="summary-title">
                Total Sales
            </div>

            <div
                class="summary-value sales"
                id="totalSales">

                ₹0

            </div>

        </div>


        <div class="summary-card">

            <div class="summary-title">
                Total Returns
            </div>

            <div
                class="summary-value returns"
                id="totalReturns">

                ₹0

            </div>

        </div>


        <div class="summary-card">

            <div class="summary-title">
                Net Sales
            </div>

            <div
                class="summary-value net"
                id="netSales">

                ₹0

            </div>

        </div>


    </div>



    <!-- ================= TABLE ================= -->

    <div class="table-card">


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>
                            Invoice No
                        </th>

                        <th>
                            Date & Time
                        </th>

                        <th>
                            Customer
                        </th>

                        <th>
                            Items
                        </th>

                        <th>
                            Payment
                        </th>

                        <th>
                            Amount
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="invoiceList">

                    <tr>

                        <td colspan="9">
                            Loading invoices...
                        </td>

                    </tr>

                </tbody>


            </table>

        </div>



        <!-- ================= FOOTER ================= -->

        <div class="table-footer">

            <div id="invoiceCount">

                Showing 0 invoices

            </div>


            <div
    class="pagination"
    id="pagination">

</div>
        </div>


    </div>



    <!-- ================= BOTTOM NAV ================= -->

    <div class="bottom-nav">


        <button
            onclick="location.href='billing.html'">

            🧾

            <br>

            New Bill

            <br>

            <small>
                F1
            </small>

        </button>


        <button>

            🧾

            <br>

            Hold Bills

            <br>

            <small>
                F2
            </small>

        </button>


        <button class="active">

            🧾

            <br>

            Invoice History

            <br>

            <small>
                F3
            </small>

        </button>


    </div>


</div>



<script
    src="js/invoice-history.js">
</script>


</body>

</html>
